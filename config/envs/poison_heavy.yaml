# Env override: poison-heavy
# Clusters are larger and more numerous — agents must learn to read
# poison density in their 5x5 obs and weigh it against their resistance.
# No env label is passed to the policy; behavior emerges from what the obs shows.
resource_overrides:
  - id: poison
    cluster_count: 8
    cluster_radius: 4
    cluster_fill_prob: 0.65
    regen_ticks: 120
    value: 2.5
  - id: flame
    display_name: "Flame Crystal"
    regen_ticks: 250
    gatherable: true
    spawn_density: 0.0
    spawn_clusters: true
    cluster_count: 1
    cluster_radius: 2
    cluster_fill_prob: 0.5
    effect: negative
    effect_params:
      potency: 0.6
    traversal_effects:
      - trigger: on_enter
        attribute: health
        delta: -0.08
        resistance_stat: flame

    value: 3.0
