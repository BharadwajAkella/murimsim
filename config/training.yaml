# RL training configuration — Phase 2
#
# Devbox capacity note (2026-04-28): this is a 16-core / 31GB box with no GPU.
# Default n_envs=4 underutilises it (~half capacity). For future runs, prefer
# n_envs=8 (≈2× throughput, leaves headroom for OS + occasional eval).
# Bumping batch_size proportionally (e.g. 64→128) keeps gradient stability.
training:
  total_timesteps: 500_000
  checkpoint_dir: checkpoints/limbic_v1
  checkpoint_freq: 100_000   # save every N steps
  log_dir: logs/ppo

# SB3 PPO hyperparameters
ppo:
  policy: MlpPolicy
  device: cpu   # MlpPolicy is faster on CPU than GPU
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  clip_range: 0.2
  ent_coef: 0.01
  policy_kwargs:
    net_arch: [64, 64]   # 2×64 MLP as specified in the plan

# Logging
wandb:
  enabled: false         # always false in tests; enable manually for training runs
  project: murimsim
  entity: null

# Phase 3c: combat training with curriculum (ATTACK/DEFEND, fight/flight)
phase3c:
  total_timesteps: 500_000
  checkpoint_dir: checkpoints/limbic_v2
  checkpoint_freq: 100_000
  n_envs: 4
  curriculum_ramp_steps: 300_000

# Phase 3b: multi-agent coexistence (N agents sharing one World, round-robin policy)
phase3b:
  total_timesteps: 200_000
  checkpoint_dir: checkpoints/limbic_v1c
  checkpoint_freq: 50_000
  n_envs: 4

# Phase 3a: multi-environment training (3 env types × 8 parallel envs, shared policy)
phase3a:
  total_timesteps: 300_000
  checkpoint_dir: checkpoints/limbic_v1b
  checkpoint_freq: 100_000

# Domain randomisation — applied per episode in SurvivalEnv.reset().
# Each episode samples world params uniformly from these ranges so the policy
# learns to survive across a spectrum of environments, not just one fixed config.
domain_randomization:
  enabled: true
  food_regen_ticks: [50, 250]      # world ticks range
  food_spawn_density: [0.03, 0.08] # spawn density range
  action_ticks: [3, 8]             # world ticks per agent action range

# LSTM / Recurrent PPO — Stage 4 training
# Replaces MlpPolicy with MlpLstmPolicy. All other env settings identical to phase3c.
lstm:
  total_timesteps: 2_000_000
  checkpoint_dir: checkpoints/limbic_lstm_v2
  checkpoint_freq: 100_000
  n_envs: 4
  curriculum_ramp_steps: 300_000
  lstm_hidden_size: 64        # size of the hidden state vector (the "notepad")
  n_lstm_layers: 1            # 1 is sufficient; 2 gives more capacity at higher cost
  shared_lstm: false          # if true, actor and critic share the LSTM
  n_steps: 512                # shorter rollout chunks suit recurrent training
  batch_size: 64              # must divide n_steps * n_envs evenly

# v12 fine-tuning config — warm-started from v11, focused on policy stability.
# Key changes vs v11:
#   - Linear LR decay: 3e-4 → 3e-5 (10x reduction by end)
#   - Linear clip_range decay: 0.2 → 0.1 (prevents late-stage policy oscillation)
#   - ent_coef raised to 0.02 (maintains exploration, reduces premature collapse)
#   - curriculum_ramp_steps = 1 (combat fully on from step 1 — already trained)
#   - Shorter run: 1M steps (fine-tuning, not full retraining)
lstm_v12:
  total_timesteps: 1_000_000
  checkpoint_freq: 100_000
  n_envs: 4
  curriculum_ramp_steps: 1        # combat already learned; ramp immediately to max
  lstm_hidden_size: 64
  n_lstm_layers: 1
  shared_lstm: false
  n_steps: 512
  batch_size: 64
  learning_rate: 0.0001           # lower start (warm-start is already well-trained)
  learning_rate_final: 0.00001    # 10x decay by end
  clip_range: 0.15                # tighter than default 0.2
  clip_range_final: 0.05          # very tight at end — lock in good policy
  ent_coef: 0.02                  # higher entropy → more exploration, less collapse

# lstm_v13: strength/resistance overhaul + clustered food maps
#   - defense_power in combat (resistances now matter for defense)
#   - Reward resistance growth (cultivation arc payoff)
#   - Group cohesion reward removed (emergent, not hand-coded)
#   - Training drains hunger 1.5x (pressure to stay near stash)
#   - Inventory cap 3 items (forces stash usage)
#   - 40% of episodes: clustered food map (pressure to forage and share)
#   - Warm-starts from v12 final
lstm_v13:
  total_timesteps: 1_500_000
  checkpoint_freq: 100_000
  n_envs: 4
  curriculum_ramp_steps: 1
  lstm_hidden_size: 64
  n_lstm_layers: 1
  shared_lstm: false
  n_steps: 512
  batch_size: 64
  learning_rate: 0.0001
  learning_rate_final: 0.00001
  clip_range: 0.15
  clip_range_final: 0.05
  ent_coef: 0.02

domain_randomization:
  enabled: true
  food_regen_ticks: [50, 250]
  food_spawn_density: [0.01, 0.06]   # v15: tightened floor (was 0.03) to encourage stash use
  action_ticks: [3, 8]
  food_cluster_prob: 0.4
  food_cluster_count: [2, 4]
  food_cluster_radius: 3
  food_cluster_fill_prob: 0.70

# lstm_v16: combat system audit fixes
#   Key changes from v15:
#   - Invalid actions redirect to REST (ATTACK/EAT/DEPOSIT/etc with no valid target)
#   - DEFEND is multiplicative: damage *= (1 - defense_power) — full nullification possible
#   - damage_taken_last_step added to obs (slot 263) — model can feel being hit
#   - obs_size: 263 → 264 (breaking change — warm-start via weight surgery, not direct load)
#   - REWARD_GROUP_WITHDRAW_BONUS defined but never applied — left as-is for v16
#   - Warm-starts from v15 via scripts/transfer_weights.py (zero-padded LSTM input)
#   - Fresh train required (obs size changed) despite weight surgery
lstm_v16:
  total_timesteps: 1_500_000
  checkpoint_freq: 100_000
  n_envs: 4
  curriculum_ramp_steps: 1
  lstm_hidden_size: 64
  n_lstm_layers: 1
  shared_lstm: false
  n_steps: 512
  batch_size: 64
  learning_rate: 0.0001
  learning_rate_final: 0.00001
  clip_range: 0.15
  clip_range_final: 0.05
  ent_coef: 0.02
  warm_start: checkpoints/limbic_lstm_v16_init/limbic_lstm_v16_init.zip


# lstm_v17: emergence pressure test
#   Key changes from v16:
#   - REWARD_RESISTANCE_GAIN_SCALE: 5.0 → 0.0 (let immunity emerge from need, not shaping)
#   - REWARD_DEPOSIT_PER_ITEM: 0.05 → 0.02 (drop training wheel for stash semantics)
#   - Boss monster enabled (enable_boss: true) — common-enemy survival pressure
#   - Combat-focus action lock + always-TRAIN bias removal (env-level)
#   - WITHDRAW mask fix
#   - Warm-starts from v16 final (load-bearing — random init gets wiped by boss)
#   - Same arch, obs (264), action space (15) — direct load via warm_start
lstm_v17:
  total_timesteps: 1_500_000
  checkpoint_freq: 100_000
  n_envs: 4
  curriculum_ramp_steps: 1
  lstm_hidden_size: 64
  n_lstm_layers: 1
  shared_lstm: false
  n_steps: 512
  batch_size: 64
  learning_rate: 0.0001
  learning_rate_final: 0.00001
  clip_range: 0.15
  clip_range_final: 0.05
  ent_coef: 0.02
  warm_start: checkpoints/limbic_lstm_v16/limbic_lstm_v16_final.zip
  enable_boss: true


# lstm_v18: tiered qi-infused strikes + concave damage curve
#   Key changes from v17:
#   - Action space expanded: 15 → 17 (added ATTACK_QI, ATTACK_BURST)
#     ⚠ HARD BREAK: cannot warm-start from v17 (action-space mismatch in policy head).
#     v18 trains from scratch — by design. v17's "survival policy" was the wrong basin
#     anyway; warm-starting would pull v18 toward v17's escape habits.
#   - Damage formula concave: damage = (√strength + tier.bonus) × 0.5
#       basic (0 qi):     √s × 0.5         → 0.50 max
#       qi-infused (1 qi): (√s + 0.3) × 0.5 → 0.65 max
#       burst (3 qi):     (√s + 0.7) × 0.5 → 0.85 max
#     COMBAT_MAX_DAMAGE raised 0.5 → 0.9 to leave headroom.
#   - Qi becomes a strategic combat resource (not just a stash deposit). Creates
#     resource pressure: deposit qi for 0.05 stash reward vs hold for spike damage.
#   - REWARD_DEPOSIT_PER_ITEM reverted 0.02 → 0.05 (v17 dropped deposits to 0).
#   - n_envs 4 → 8, batch_size 64 → 128 (saturate the 16-core devbox).
lstm_v18:
  total_timesteps: 1_500_000
  checkpoint_freq: 100_000
  n_envs: 12
  curriculum_ramp_steps: 1
  lstm_hidden_size: 64
  n_lstm_layers: 1
  shared_lstm: false
  n_steps: 512
  batch_size: 128
  learning_rate: 0.0003          # higher LR — training from scratch, not fine-tuning
  learning_rate_final: 0.00003
  clip_range: 0.20
  clip_range_final: 0.05
  ent_coef: 0.03                 # higher initial entropy — encourage exploring 3 attack tiers
  warm_start: null               # ⚠ MUST be null — v17 action space (15) ≠ v18 (17)
  enable_boss: true


# lstm_v19: emergent allegiance via pairwise affinity matrix
#   Key changes from v18:
#   - Sect identity removed entirely (no more sect_id, no sect-region spawn).
#   - Pairwise affinity matrix: directional, exponentially-decaying scalar per
#     ordered (i, j) agent pair, updated on share/attack/steal/flank events.
#     Asymmetric magnitudes — victim builds more hostility than attacker, etc.
#   - Obs grows: agent grid 5×5×4 → 5×5×5 (added affinity channel, tile-MAX).
#     OBS_TOTAL_SIZE 264 → 289. ⚠ HARD BREAK: cannot warm-start v18 (obs/policy
#     input shape mismatch).
#   - Reward shaping:
#       * Coordinated-attack bonus scaled by mean focal→flanker affinity
#         (familiar coordination > random coordination).
#       * Mutual-share bonus when focal shares with someone whose affinity
#         to focal is already positive (signals reciprocity forming).
#       * Betrayal penalty when focal attacks a high-affinity (>0.5) target.
#       * Focal-as-recipient share bonus REMOVED (was teaching "stand near
#         scripted sharers"; rubber-duck critique #2).
#   - New telemetry: ep_betrayal_count, ep_friendly_flank_count,
#     ep_focal_max_affinity, ep_focal_min_affinity.
#   - All other v18 params kept (qi-infused strikes, boss enabled, etc.)
lstm_v19:
  total_timesteps: 1_500_000
  checkpoint_freq: 100_000
  n_envs: 12
  curriculum_ramp_steps: 1
  lstm_hidden_size: 64
  n_lstm_layers: 1
  shared_lstm: false
  n_steps: 512
  batch_size: 128
  learning_rate: 0.0003
  learning_rate_final: 0.00003
  clip_range: 0.20
  clip_range_final: 0.05
  ent_coef: 0.03
  warm_start: null               # ⚠ MUST be null — v18 obs (264) ≠ v19 (289)
  enable_boss: true


# lstm_v19b: v19 + anonymous spawn-clustering (commit 7a4d5b7)
#   3 clusters, radius 4, centres resampled per reset; no identity tags.
